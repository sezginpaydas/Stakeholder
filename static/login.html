<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · Görev Panosu</title>
<style>
  :root {
    --bg: #f4f6fb;
    --line: #e6e9f1;
    --line-strong: #d7dce8;
    --text: #2a3042;
    --muted: #7b8398;
    --primary: #6b7be6;
    --primary-hover: #5b6bd9;
    --primary-soft: #eef0fd;
    --late: #c55f5f;
    --late-bg: #fcecec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 15% 20%, #e7ebfd 0, transparent 40%),
      radial-gradient(circle at 85% 80%, #e3f4ee 0, transparent 42%),
      var(--bg);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .card {
    width: min(400px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 30px 28px;
    box-shadow: 0 20px 50px rgba(30, 40, 80, .08);
  }
  .logo {
    width: 44px; height: 44px; border-radius: 13px;
    background: linear-gradient(135deg, #8d9af1, #72c6c8);
    color: #fff; display: grid; place-items: center;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 650; }
  .sub { margin: 4px 0 22px; color: var(--muted); }
  form { display: flex; flex-direction: column; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12.5px; font-weight: 600; color: #535b70; }
  .input {
    width: 100%;
    border: 1px solid var(--line-strong);
    background: #fbfcfe;
    border-radius: 10px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px var(--primary-soft); }
  .pw { position: relative; }
  .pw .input { padding-right: 64px; }
  .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; color: var(--muted);
    font-size: 12.5px; font-weight: 600; padding: 6px 8px; border-radius: 7px; cursor: pointer;
  }
  .toggle:hover { background: var(--primary-soft); color: var(--primary); }
  .btn {
    margin-top: 6px;
    border: 0; border-radius: 10px;
    padding: 11px 14px;
    background: var(--primary); color: #fff;
    font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 12px rgba(107, 123, 230, .28);
    transition: background .15s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn:focus-visible, .toggle:focus-visible, .person:focus-visible, .back:focus-visible { outline: 3px solid #c9d0fa; outline-offset: 1px; }
  .team-chip { display: inline-block; margin-bottom: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5f6ac4; background: var(--primary-soft); padding: 2px 10px; border-radius: 20px; }
  .error { background: var(--late-bg); color: var(--late); border-radius: 9px; padding: 9px 12px; font-size: 13px; }

  /* 2. adım: sen kimsin? */
  .people { display: flex; flex-direction: column; gap: 8px; }
  .person {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: #fbfcfe; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; cursor: pointer;
    font-weight: 600; font-size: 15px;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .person:hover { border-color: #cdd3f5; background: var(--primary-soft); transform: translateX(2px); }
  .person:disabled { opacity: .6; cursor: wait; transform: none; }
  .person .arrow { margin-left: auto; color: var(--muted); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; }
  .back {
    align-self: flex-start; margin-top: 14px;
    border: 0; background: transparent; color: var(--muted);
    font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  }
  .back:hover { color: var(--primary); }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>

    <section id="stepLogin">
      <h1>Görev Panosu</h1>
      <p class="sub">Devam etmek için giriş yapın.</p>
      <form id="loginForm" novalidate>
        <div class="error" id="error" role="alert" hidden></div>
        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" class="input" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus>
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <div class="pw">
            <input id="password" class="input" type="password" autocomplete="current-password">
            <button type="button" class="toggle" id="toggle">Göster</button>
          </div>
        </div>
        <button type="submit" class="btn" id="submit">Devam</button>
      </form>
    </section>

    <section id="stepWho" hidden>
      <div class="team-chip" id="whoTeam" lang="en"></div>
      <h1>Sen kimsin?</h1>
      <p class="sub">İsmini seç; sana atanan görevlerin bildirimleri burada görünecek.</p>
      <div class="error" id="whoError" role="alert" hidden></div>
      <div class="people" id="people"></div>
      <button type="button" class="back" id="back">← Geri</button>
    </section>
  </main>

<script>
const AVATAR_COLORS = [
  ['#e7ebfd', '#5563c9'], ['#e3f4ee', '#3b8a66'], ['#fdeee4', '#b8683a'],
  ['#fbe8f1', '#b0507f'], ['#e6f2fb', '#3a78ad'],
];
const $ = (id) => document.getElementById(id);
const password = $('password');
let creds = null;

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function login(extra) {
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ...creds, ...extra }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Giriş yapılamadı');
  return data;
}

function showError(box, msg) {
  box.textContent = msg;
  box.hidden = false;
}

$('toggle').addEventListener('click', (e) => {
  const show = password.type === 'password';
  password.type = show ? 'text' : 'password';
  e.target.textContent = show ? 'Gizle' : 'Göster';
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('error').hidden = true;
  $('submit').disabled = true;
  creds = { username: $('username').value, password: password.value };
  try {
    const data = await login({});
    $('whoTeam').textContent = data.team;
    $('people').innerHTML = data.users.map((u, i) => {
      const [bg, fg] = AVATAR_COLORS[i % AVATAR_COLORS.length];
      return `<button type="button" class="person" data-user="${esc(u)}">
        <span class="avatar" style="background:${bg};color:${fg}">${esc(u.charAt(0).toLocaleUpperCase('tr-TR'))}</span>
        ${esc(u)}<span class="arrow">→</span></button>`;
    }).join('');
    $('whoError').hidden = true;
    $('stepLogin').hidden = true;
    $('stepWho').hidden = false;
    $('people').querySelector('.person').focus();
  } catch (err) {
    showError($('error'), err.message === 'Failed to fetch' ? 'Sunucuya ulaşılamıyor' : err.message);
    password.select();
  }
  $('submit').disabled = false;
});

$('people').addEventListener('click', async (e) => {
  const btn = e.target.closest('.person');
  if (!btn) return;
  $('people').querySelectorAll('.person').forEach((b) => { b.disabled = true; });
  try {
    await login({ user: btn.dataset.user });
    location.replace('/');
  } catch (err) {
    showError($('whoError'), err.message === 'Failed to fetch' ? 'Sunucuya ulaşılamıyor' : err.message);
    $('people').querySelectorAll('.person').forEach((b) => { b.disabled = false; });
  }
});

$('back').addEventListener('click', () => {
  creds = null;
  $('stepWho').hidden = true;
  $('stepLogin').hidden = false;
  password.value = '';
  password.focus();
});
</script>
</body>
</html>
